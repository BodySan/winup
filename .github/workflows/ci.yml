name: Проверка WinUp
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: WinUp / functional
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Проверить исходники и расширение
        shell: powershell
        run: ./qa/security/ci.ps1 -FunctionalOnly
      - name: Подготовить Go для проверки сборки
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
          cache: false
      - name: Проверить происхождение файлового помощника
        shell: powershell
        run: ./tools/verify-file-packages.ps1 -Output C:/WinUp/test/ci/candidate/package-rebuild
      - name: Собрать архив исходников
        shell: powershell
        run: ./qa/tests/source-archive.ps1
      - name: Сохранить результаты
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results
          path: C:/WinUp/test/ci/candidate/*.txt

name: Проверка WinUp
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: WinUp / functional
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Проверить исходники и расширение
        shell: powershell
        run: ./qa/security/ci.ps1 -FunctionalOnly
      - name: Собрать архив исходников
        shell: powershell
        run: |
          ./tools/archive-source.ps1 -Source ./src -Output C:/WinUp/test/ci/source-check.zip
          if ($LASTEXITCODE) { throw 'Source archive creation failed' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead('C:/WinUp/test/ci/source-check.zip')
          try {
            foreach ($name in @('src/build.ps1', 'src/Properties/AssemblyInfo.cs', 'doc/Инструкция.html', 'tools/verify-app.ps1')) {
              if (!$archive.GetEntry($name)) { throw "Required source archive entry missing: $name" }
            }
          } finally { $archive.Dispose() }
      - name: Сохранить результаты
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results
          path: C:/WinUp/test/ci/candidate/*.txt

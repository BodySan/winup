name: Проверить компоненты
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
concurrency:
  group: component-release
  cancel-in-progress: false
jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Подготовить новые зависимости
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.425'
      - name: Подготовить кандидат
        shell: powershell
        run: ./src/updates/candidate.ps1 -Output C:/WinUp/candidate/src
      - name: Прогнать проверки без ключа подписи
        shell: powershell
        run: ./qa/security/ci.ps1 -Source C:/WinUp/candidate/src -FunctionalOnly
      - name: Сохранить проверенный комплект
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-source
          path: C:/WinUp/candidate/src/
          retention-days: 7
      - name: Сохранить проверенное приложение
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-executable
          path: C:/WinUp/test/ci/candidate/WinUp.exe
      - name: Сохранить результаты
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: component-test-results
          path: C:/WinUp/test/ci/candidate/*.txt

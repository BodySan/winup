<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>WinUp — интерактивный макет</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Навигация">
      <a class="brand" href="#passwords" aria-label="WinUp, пароли"><img src="icon.svg" alt=""><strong>winup<span>Личное пространство</span></strong></a>
      <button class="vault-switch" data-action="database"><span class="vault-symbol"></span><span><b id="db-name">Личная база</b><small id="db-state">Открыта · учебная копия</small></span><span class="chevron">⌄</span></button>
      <p class="nav-label">МОЁ ПРОСТРАНСТВО</p>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom">
        <button data-action="extension" aria-label="Расширение браузера" title="Расширение браузера"><span data-icon="puzzle"></span><span>Расширение браузера</span><i class="status-dot"></i></button>
        <button data-action="settings" aria-label="Настройки" title="Настройки"><span data-icon="settings"></span><span>Настройки</span></button>
        <button data-action="help" aria-label="Помощь" title="Помощь"><span data-icon="help"></span><span>Помощь</span></button>
        <div class="sidebar-footer"><span class="avatar">Д</span><div><b>Демо-профиль</b><small>WinUp 2</small></div><button class="icon-button" data-action="theme" title="Сменить тему" aria-label="Сменить тему"><span data-icon="sun"></span></button></div>
      </div>
    </aside>
    <main>
      <header class="topbar"><div class="breadcrumb">Личное пространство <span>/</span> <b id="breadcrumb">Пароли</b></div><div class="topbar-actions"><span class="demo-label"><i></i>Макет · тестовые данные</span><button class="icon-button" data-action="commands" title="Все действия · Ctrl+K" aria-label="Все действия"><span data-icon="search"></span></button><button class="icon-button" data-action="activity" title="Журнал действий" aria-label="Журнал действий"><span data-icon="bell"></span></button><button class="button small" data-action="lock-all"><span data-icon="lock"></span>Заблокировать всё</button></div></header>
      <div class="page-head"><div><div class="eyebrow" id="eyebrow">АККАУНТЫ И ДОСТУП</div><h1 id="page-title">Пароли</h1><p id="page-description"></p></div><div class="head-actions" id="head-actions"></div></div>
      <section id="content" aria-label="Содержимое раздела"></section>
      <footer class="main-footer"><span><i class="status-dot"></i><span id="footer-status">Учебные данные. Ваши базы и файлы не используются.</span></span><button data-action="about">WinUp 2 · дизайн-предпросмотр<span data-icon="arrow-up-right"></span></button></footer>
    </main>
  </div>
  <div id="popovers"></div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-head"><div><div id="modal-eyebrow" class="eyebrow">WINUP</div><h2 id="modal-title"></h2></div><button class="icon-button" data-action="close" aria-label="Закрыть окно"><span data-icon="x"></span></button></div><div id="modal-body"></div><div id="modal-footer" class="modal-footer"></div></dialog>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script src="catalog.js"></script>
  <script src="cards.js"></script><script src="app.js"></script>
  <script src="parity.js"></script>
</body>
</html>
